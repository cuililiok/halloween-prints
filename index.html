<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />

  <title>万圣节印花侦察台 · 已暂停</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

      min-height: 100vh;

      border: 1px solid #2a3344;

      padding: 28px 24px;
      text-align: center;
    }
    .badge {
      display: inline-block;
      font-size: 12px;
      color: #fde68a;
      border: 1px solid rgba(251,191,36,.35);
      background: rgba(251,191,36,.08);
      border-radius: 999px;
      padding: 4px 10px;
      margin-bottom: 14px;
    }
    h1 { font-size: 1.25rem; margin-bottom: 8px; }
    p { font-size: 14px; color: #97a0b3; line-height: 1.6; margin-bottom: 18px; }
    a {
      display: inline-block;
      color: #111;
      background: #fbbf24;
      text-decoration: none;
      font-weight: 700;
      font-size: 14px;
      padding: 10px 16px;
      border-radius: 10px;
    }
  </style>
</head>
<body>
  <div class="box">
    <div class="badge">万圣节项目已暂停</div>
